# Weekly: records this week's numbers in ds-guard-history.json and publishes the
# one-page leadership report to GitHub Pages (Settings > Pages > Source: GitHub Actions).
name: Leadership report
on:
  schedule: [{ cron: '0 6 * * 1' }]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  report:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # Until @ds-guard/cli is on npm, point this at a packed tarball of the CLI.
      - run: npx --yes @ds-guard/cli report --record
      - name: Commit the history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ds-guard-history.json
          git diff --cached --quiet || git commit -m "Record weekly DS Guard metrics" && git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: ds-guard-report }
      - uses: actions/deploy-pages@v4
